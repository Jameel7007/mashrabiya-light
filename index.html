<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231a120c'/%3E%3Cpath d='M12 3l1.9 4.6 4.5-1.9-1.9 4.5L21 12l-4.5 1.9 1.9 4.5-4.5-1.9L12 21l-1.9-4.6-4.5 1.9 1.9-4.5L3 12l4.6-1.9-1.9-4.5 4.5 1.9z' fill='%23f2c27a'/%3E%3C/svg%3E">
<title>Mashrabiya Light</title>
<meta name="description" content="Sunlight and stained glass through a carved wooden mashrabiya screen. Move the cursor, drag, or tilt to move the sun from dawn to the blue hour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Reem+Kufi:wght@500&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed WebGL room; a small carved-plaque title and a quiet hint sit low on the left. */
:root {
  --bg: #e7dccb;          /* sunlit lime plaster, the loading veil */
  --veil-ink: #5c4330;    /* cedar brown on the veil */
  --ink: #fbf1e2;         /* text over the dim room */
  --ink-soft: rgba(251, 241, 226, 0.66);
  --glow: #f2c27a;        /* low sun */
  --chip: rgba(28, 18, 10, 0.38);
  --chip-line: rgba(251, 241, 226, 0.28);
  --font-display: "Marcellus", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-arabic: "Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", "Segoe UI", sans-serif;
  --font-ui: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a120c; --veil-ink: #c9a77c; --ink: #fbf1e2; --ink-soft: rgba(251, 241, 226, 0.62);
    --glow: #f0a860; --chip: rgba(12, 8, 5, 0.5); --chip-line: rgba(251, 241, 226, 0.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a120c; --veil-ink: #c9a77c; --ink: #fbf1e2; --ink-soft: rgba(251, 241, 226, 0.62);
  --glow: #f0a860; --chip: rgba(12, 8, 5, 0.5); --chip-line: rgba(251, 241, 226, 0.22);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-tap-highlight-color: transparent; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: ew-resize; }

.hud {
  position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(max(18px, env(safe-area-inset-bottom, 0px)) + 6px);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.plate { display: grid; gap: 6px; min-width: 0; padding-left: clamp(0px, 2vw, 16px); }
.plate h1 { margin: 0; display: flex; align-items: baseline; gap: 12px; font-weight: 400; text-wrap: balance; }
.plate .ar { font-family: var(--font-arabic); font-weight: 500; font-size: clamp(26px, 4.2vw, 38px); line-height: 1; color: var(--ink); text-shadow: 0 1px 18px rgba(0,0,0,.45); }
.plate .en { font-family: var(--font-display); font-size: clamp(13px, 1.5vw, 16px); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); text-shadow: 0 1px 12px rgba(0,0,0,.5); }
.hint { margin: 0; font-size: 14px; letter-spacing: .04em; color: var(--ink-soft); text-shadow: 0 1px 10px rgba(0,0,0,.6); transition: opacity 1.6s ease; }
.hint.gone { opacity: 0; }
#tilt {
  pointer-events: auto; font: 500 13px/1 var(--font-ui); letter-spacing: .06em; color: var(--ink);
  background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px; padding: 10px 16px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#tilt:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

/* the small toolbar: lattice patterns and sound, top centre so reaching for it on desktop lands near noon */
.tools {
  position: fixed; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 4px); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 4px; z-index: 3;
  background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: .8; transition: opacity .4s ease;
}
.tools:hover, .tools:focus-within { opacity: 1; }
.tools .sep { width: 1px; height: 22px; margin: 0 4px; background: var(--chip-line); }
.tool {
  width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center;
  background: transparent; color: var(--ink); cursor: pointer; transition: background-color .25s ease, color .25s ease;
}
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: rgba(251, 241, 226, .1); }
.tool:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
.pick[aria-pressed="true"] { color: var(--glow); background: rgba(242, 194, 122, .16); }
#sound .wave { display: none; }
#sound[aria-pressed="true"] .wave { display: inline; }
#sound[aria-pressed="true"] .mute { display: none; }

#veil {
  position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--veil-ink);
  transition: opacity 1.8s ease; z-index: 5;
}
#veil.lifted { opacity: 0; pointer-events: none; }
#veil .mark { display: grid; gap: 10px; justify-items: center; text-align: center; padding-inline: 24px; }
#veil .mark .ar { font-family: var(--font-arabic); font-size: 44px; line-height: 1; }
#veil .mark p { margin: 0; font-family: var(--font-display); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
#veil .mark p.err { text-transform: none; letter-spacing: .02em; font-family: var(--font-ui); font-size: 15px; max-width: 34ch; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { #veil, .hint { transition-duration: .01s; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="A room lit by sunlight through a carved wooden lattice screen"></canvas>

<div class="hud">
  <div class="plate">
    <h1><span class="ar" lang="ar">مشربية</span><span class="en">Mashrabiya</span></h1>
    <p class="hint" id="hint">Move across the room to move the sun</p>
  </div>
  <button id="tilt" type="button" hidden>Use tilt</button>
</div>

<div class="tools" id="tools">
  <button id="sound" class="tool" type="button" aria-pressed="false" aria-label="Sound off">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/>
      <path class="wave" d="M14.6 9.3a3.8 3.8 0 0 1 0 5.4M17 6.9a7.2 7.2 0 0 1 0 10.2"/>
      <path class="mute" d="M15.2 9.6l4.8 4.8M20 9.6l-4.8 4.8"/>
    </svg>
  </button>
</div>

<div id="veil"><div class="mark"><span class="ar" lang="ar">مشربية</span><p id="veilText">Opening the shutters</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";
const veil = document.getElementById("veil");
const veilText = document.getElementById("veilText");
function fail(msg) { veilText.textContent = msg; veilText.className = "err"; }
if (!window.THREE) { fail("The 3D library could not load. Check the connection and open the page again."); return; }

/* ---------- Room dimensions (metres) ---------- */
const ROOM = { x: 3.2, h: 4.8, d: 9.5 };              // x from -3.2 to 3.2, y 0..4.8, z 0..9.5
const WIN = { x0: -1.25, y0: 0.9, w: 2.5, h: 3.1 };   // opening in the back wall (z = 0)
const WALL_T = 0.45;                                   // wall thickness, opening reveal depth
const LAT = { zc: -0.12, d: 0.06, bar: 0.052 };        // lattice plane, depth and bar width
const DADO = 0.9;                                      // height of the tiled dado band

/* ---------- Star lattices by Hankin's method: polygons in contact, two rays from each edge's middle ---------- */
function intersect(p, d, q, e) {
  const den = d[0] * e[1] - d[1] * e[0];
  const t = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / den;
  return [p[0] + d[0] * t, p[1] + d[1] * t];
}
function hankin(poly, theta) {   // theta: the contact angle between each ray and its edge
  const n = poly.length, mids = [], tans = [], segs = [], pts = [];
  for (let k = 0; k < n; k++) {
    const a = poly[k], b = poly[(k + 1) % n];
    mids.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    tans.push([dx / l, dy / l]);
  }
  const c = Math.cos(theta), s = Math.sin(theta);
  for (let k = 0; k < n; k++) {
    const k1 = (k + 1) % n, t0 = tans[k], t1 = tans[k1];
    const d0 = [c * t0[0] - s * t0[1], c * t0[1] + s * t0[0]];
    const d1 = [-c * t1[0] - s * t1[1], -c * t1[1] + s * t1[0]];
    const P = intersect(mids[k], d0, mids[k1], d1);
    segs.push([mids[k], P], [mids[k1], P]);
    pts.push(P);
  }
  return { mids, pts, segs };
}
function regular(cx, cy, n, R, a0) {
  const v = [];
  for (let k = 0; k < n; k++) { const a = a0 + k * 2 * Math.PI / n; v.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
  return v;
}
function starOutline(h, c, scale) {
  const out = [];
  for (let k = 0; k < h.mids.length; k++) {
    for (const p of [h.mids[k], h.pts[k]]) out.push([c[0] + (p[0] - c[0]) * scale, c[1] + (p[1] - c[1]) * scale]);
  }
  return out;
}
const about = (p, c, s) => [c[0] + (p[0] - c[0]) * s, c[1] + (p[1] - c[1]) * s];
const ring = poly => poly.map((p, i) => [p, poly[(i + 1) % poly.length]]);
const inWin = (p, m) => p[0] > WIN.x0 - m && p[0] < WIN.x0 + WIN.w + m && p[1] > WIN.y0 - m && p[1] < WIN.y0 + WIN.h + m;
const CY = WIN.y0 + WIN.h / 2;   // the screen's centre line

/* ---------- Jewel glass (qamariya), as light transmission colours (linear) ---------- */
// Deep on purpose: the weak channels must sit near zero for the colour to survive tone mapping.
const JEWEL = {
  lapis:     [0.012, 0.050, 0.78],
  emerald:   [0.006, 0.420, 0.065],
  ruby:      [0.820, 0.008, 0.020],
  amber:     [1.000, 0.380, 0.012],
  turquoise: [0.006, 0.460, 0.440],
};

/* ---------- The four lattices ---------- */
// A pattern is wood in the screen's plane (metres): bars at full width, spokes at half width, frames
// (thin outlines that hold a glass heart), solids (filled shapes) and discs (turned beads), plus the
// rosette centres ("motifs") that the glass plans refer to. Glass plans name rosettes by grid
// position: petals alternate two colours, a heart turns the solid centre star into a small glass
// one, a ring glazes the openings around the rosette. Every plan is mirror-symmetric and leaves
// most openings clear, so the white light still reads.
const lattice = () => ({ bars: [], spokes: [], solids: [], frames: [], discs: [], motifs: [], glassFor: rosetteGlass });
function rosette(out, h, c, r, n, plan = {}, ros = 0.36) {
  const heart = starOutline(h, c, ros);
  (plan.heart ? out.frames : out.solids).push(heart);
  for (const m of h.mids) out.spokes.push([about(m, c, ros), m]);
  out.motifs.push({ c, r, n, a0: Math.atan2(h.mids[0][1] - c[1], h.mids[0][0] - c[0]), plan });
}

// Eight-pointed {8/3} stars: octagons and squares in contact (4.8.8) at 67.5 degrees.
const GLASS8 = {
  "-1,0":  { petals: ["ruby", "amber"], heart: "amber", ring: "lapis" },
  "0,0":   { petals: ["ruby", "amber"], heart: "amber", ring: "lapis" },
  "-2,1":  { petals: ["turquoise", "lapis"] },
  "1,1":   { petals: ["turquoise", "lapis"] },
  "-2,-1": { petals: ["emerald", "amber"] },
  "1,-1":  { petals: ["emerald", "amber"] },
  "-1,2":  { heart: "ruby" },
  "0,2":   { heart: "ruby" },
  "-1,-2": { heart: "turquoise" },
  "0,-2":  { heart: "turquoise" },
};
function pattern8() {
  const out = lattice(), CELL = WIN.w / 4, theta = 67.5 * Math.PI / 180;   // four octagons across
  const r = CELL / 2, R8 = r / Math.cos(Math.PI / 8), rs = r * Math.tan(Math.PI / 8);
  for (let i = -2; i <= 1; i++) for (let k = -4; k <= 4; k++) {
    const c = [(i + 0.5) * CELL, CY + k * CELL];
    if (!inWin(c, CELL * 0.6)) continue;
    const h = hankin(regular(c[0], c[1], 8, R8, Math.PI / 8), theta);
    out.bars.push(...h.segs);
    rosette(out, h, c, r, 8, GLASS8[i + "," + k]);
  }
  for (let i = -2; i <= 2; i++) for (let k = -4; k <= 4; k++) {
    const c = [i * CELL, CY + (k + 0.5) * CELL];
    if (!inWin(c, CELL * 0.5)) continue;
    const h = hankin(regular(c[0], c[1], 4, rs * Math.SQRT2, 0), theta);
    out.bars.push(...h.segs);
    out.solids.push(starOutline(h, c, 1));
  }
  return out;
}

// Six-pointed stars: hexagons in contact at 60 degrees, a hexagram in each and small hexagons between.
// Odd columns sit half a row higher.
const GLASS6 = {
  "0,0":   { petals: ["ruby", "amber"], heart: "amber", ring: "lapis" },
  "-1,0":  { petals: ["turquoise", "lapis"] },
  "1,0":   { petals: ["turquoise", "lapis"] },
  "-1,-1": { petals: ["emerald", "amber"] },
  "1,-1":  { petals: ["emerald", "amber"] },
  "0,2":   { heart: "ruby" },
  "-2,1":  { heart: "ruby" },
  "2,1":   { heart: "ruby" },
  "0,-2":  { heart: "turquoise" },
  "-2,-2": { heart: "turquoise" },
  "2,-2":  { heart: "turquoise" },
};
function pattern6() {
  const out = lattice(), R = 0.36, dx = 1.5 * R, dy = Math.sqrt(3) * R;
  for (let i = -3; i <= 3; i++) for (let k = -4; k <= 4; k++) {
    const c = [i * dx, CY + k * dy + (i & 1 ? dy / 2 : 0)];
    if (!inWin(c, R)) continue;
    const h = hankin(regular(c[0], c[1], 6, R, 0), Math.PI / 3);
    out.bars.push(...h.segs);
    rosette(out, h, c, R * Math.sqrt(3) / 2, 6, GLASS6[i + "," + k]);
  }
  return out;
}

// Twelve-pointed rosettes: dodecagons, hexagons and squares in contact (4.6.12) at 60 degrees.
// Dodecagons sit on a triangular grid, a square between each neighbouring pair, a hexagon in each
// triangle of three.
const GLASS12 = {
  "0,0":  { petals: ["ruby", "amber"], heart: "amber", ring: "lapis" },
  "-1,1": { heart: "ruby" },
  "0,1":  { heart: "ruby" },
  "0,-1": { heart: "emerald" },
  "1,-1": { heart: "emerald" },
};
function pattern12() {
  const out = lattice(), a = 0.21, D = (3 + Math.sqrt(3)) * a, theta = Math.PI / 3;
  const R12 = a / (2 * Math.sin(Math.PI / 12)), r12 = a / (2 * Math.tan(Math.PI / 12));
  const at = (i, j) => [(i + j / 2) * D, CY + j * D * Math.sqrt(3) / 2];
  for (let j = -3; j <= 3; j++) for (let i = -4; i <= 4; i++) {
    const c = at(i, j);
    if (inWin(c, R12)) {
      const h = hankin(regular(c[0], c[1], 12, R12, Math.PI / 12), theta);
      out.bars.push(...h.segs);
      rosette(out, h, c, r12, 12, GLASS12[i + "," + j]);
    }
    for (const [di, dj] of [[1, 0], [0, 1], [-1, 1]]) {   // squares toward three of the six neighbours
      const d = at(i + di, j + dj), m = [(c[0] + d[0]) / 2, (c[1] + d[1]) / 2];
      if (!inWin(m, a)) continue;
      const h = hankin(regular(m[0], m[1], 4, a / Math.SQRT2, Math.atan2(d[1] - c[1], d[0] - c[0]) + Math.PI / 4), theta);
      out.bars.push(...h.segs);
      out.solids.push(starOutline(h, m, 1));
    }
    for (const [p, q] of [[[1, 0], [0, 1]], [[0, 1], [-1, 1]]]) {   // hexagons, one per triangle
      const b = at(i + p[0], j + p[1]), d = at(i + q[0], j + q[1]);
      const g = [(c[0] + b[0] + d[0]) / 3, (c[1] + b[1] + d[1]) / 3];
      if (!inWin(g, a)) continue;
      const h = hankin(regular(g[0], g[1], 6, a, 0), theta);
      out.bars.push(...h.segs);
      // the six hexagrams around the central rosette are glazed turquoise
      out.motifs.push({ c: g, r: a * Math.sqrt(3) / 2, n: 6, a0: 0, plan: Math.hypot(g[0], g[1] - CY) < 0.7 ? { heart: "turquoise" } : {} });
    }
  }
  return out;
}

// Turned wood, the classic Cairene mashrabiya: a diagonal grid of round spindles with a ball where
// they cross and a bead between, and a small jewelled diamond of glass at its heart.
const TURN = 0.105;   // spindle spacing
function patternTurned() {
  const out = lattice(), q = Math.SQRT1_2, reach = 22;
  Object.assign(out, { round: true, barW: 0.018, depth: 0.03, glassFor: turnedGlass });
  for (let k = -reach; k <= reach; k++) {
    for (const [dx, dy] of [[q, q], [q, -q]]) {
      const p = [-dy * k * TURN, CY + dx * k * TURN];
      out.bars.push([[p[0] - dx * 4, p[1] - dy * 4], [p[0] + dx * 4, p[1] + dy * 4]]);
    }
  }
  for (let i = -reach; i <= reach; i++) for (let j = -reach; j <= reach; j++) {
    for (const [bi, bj, r] of [[0, 0, 0.024], [0.5, 0, 0.017], [0, 0.5, 0.017]]) {
      const p = [(i + bi - j - bj) * TURN * q, CY + (i + bi + j + bj) * TURN * q];
      if (inWin(p, 0.03)) out.discs.push([p[0], p[1], r]);
    }
  }
  return out;
}
// rings of openings around the centre, counted along the grid
function turnedGlass(pat, x, y) {
  const q = Math.SQRT1_2, u = (x + y - CY) * q / TURN, v = (y - CY - x) * q / TURN;
  return ["ruby", "amber", "lapis"][Math.floor(Math.max(Math.abs(u), Math.abs(v)))] || null;
}

// Icons: each pattern's own star outline drawn small, and the turned screen as a beaded grid.
function starIcon(n, inner) {
  let d = "";
  for (let k = 0; k < 2 * n; k++) {
    const a = -Math.PI / 2 + k * Math.PI / n, r = k % 2 ? 9 * inner : 9;
    d += (k ? "L" : "M") + (12 + r * Math.cos(a)).toFixed(2) + " " + (12 + r * Math.sin(a)).toFixed(2);
  }
  return `<path d="${d}Z"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>`;
}
function turnedIcon() {
  let d = "", dots = "";
  for (let k = -1; k <= 1; k++) {
    d += `M${12 + (-1 - k) * 3.5} ${12 + (k - 1) * 3.5}l7 7`;   // spindles one way
    d += `M${12 + (k + 1) * 3.5} ${12 + (k - 1) * 3.5}l-7 7`;   // and the other
  }
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    dots += `<circle cx="${12 + (i - j) * 3.5}" cy="${12 + (i + j) * 3.5}" r="1.5" fill="currentColor" stroke="none"/>`;
  }
  return `<path d="${d}"/>${dots}`;
}
const PATTERNS = [
  { name: "Eight-pointed stars", build: pattern8, icon: starIcon(8, 0.54) },
  { name: "Six-pointed stars", build: pattern6, icon: starIcon(6, 0.58) },
  { name: "Twelve-pointed rosettes", build: pattern12, icon: starIcon(12, 0.7) },
  { name: "Turned wood", build: patternTurned, icon: turnedIcon() },
];

// Choose the glass for one opening (by its centre) from the rosette plans around it.
function rosetteGlass(pat, x, y) {
  let near = null, nd = 1e9;
  for (const m of pat.motifs) { const d = Math.hypot(x - m.c[0], y - m.c[1]) / m.r; if (d < nd) { nd = d; near = m; } }
  if (!near) return null;
  if (nd < 0.2) return near.plan.heart || null;
  if (nd < 0.8) {
    if (!near.plan.petals) return null;
    const step = 2 * Math.PI / near.n;
    const q = Math.floor((Math.atan2(y - near.c[1], x - near.c[0]) - near.a0) / step);
    return near.plan.petals[((q % 2) + 2) % 2];
  }
  for (const m of pat.motifs) if (m.plan.ring && Math.hypot(x - m.c[0], y - m.c[1]) / m.r < 1.3) return m.plan.ring;
  return null;
}

/* ---------- Mask texture: rgb = colour of light let through (glass tints it), alpha = open ---------- */
const MASK_W = 1024, MASK_H = Math.round(MASK_W * WIN.h / WIN.w);
const PX = MASK_W / WIN.w;
const maskCanvas = document.createElement("canvas");
maskCanvas.width = MASK_W; maskCanvas.height = MASK_H;
const maskTex = new THREE.CanvasTexture(maskCanvas);
maskTex.colorSpace = THREE.NoColorSpace;
maskTex.premultiplyAlpha = true;            // rgb arrives multiplied by openness, so the mip blur stays right
maskTex.generateMipmaps = true;
maskTex.minFilter = THREE.LinearMipmapLinearFilter;
maskTex.magFilter = THREE.LinearFilter;
maskTex.wrapS = maskTex.wrapT = THREE.ClampToEdgeWrapping;

// The wood, drawn in black at px pixels per metre (shared by the mask and the opening finder).
// grow fattens every piece by that many pixels, which closes hairline gaps such as a spoke
// meeting the sharp tip of a heart star.
function drawWood(g, pat, px, grow = 0) {
  const X = x => (x - WIN.x0) * px, Y = y => (WIN.y0 + WIN.h - y) * px;
  const path = poly => { g.beginPath(); poly.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.closePath(); };
  g.strokeStyle = "#000"; g.fillStyle = "#000"; g.lineCap = "square"; g.lineJoin = "miter";
  g.lineWidth = (pat.barW || LAT.bar) * px + grow;
  g.beginPath();
  for (const [a, b] of pat.bars) { g.moveTo(X(a[0]), Y(a[1])); g.lineTo(X(b[0]), Y(b[1])); }
  g.stroke();
  for (const [x, y, r] of pat.discs) { g.beginPath(); g.arc(X(x), Y(y), r * px + grow / 2, 0, 2 * Math.PI); g.fill(); }
  g.lineWidth = LAT.bar * 0.5 * px + grow; g.lineCap = grow ? "square" : "butt";
  g.beginPath();
  for (const [a, b] of pat.spokes) { g.moveTo(X(a[0]), Y(a[1])); g.lineTo(X(b[0]), Y(b[1])); }
  g.stroke();
  for (const s of pat.frames) { path(s); g.stroke(); }
  for (const s of pat.solids) { path(s); g.fill(); if (grow) { g.lineWidth = grow; g.stroke(); } }
  const f = 0.09 * px, w = WIN.w * px, h = WIN.h * px;   // frame
  g.fillRect(0, 0, w, f); g.fillRect(0, h - f, w, f); g.fillRect(0, 0, f, h); g.fillRect(w - f, 0, f, h);
}

// Find every opening in the lattice (a flood fill at low resolution) and paint the glazed ones
// into a small colour layer, grown three pixels so each pane tucks under the wood around it.
const LBL_W = 400, LBL_H = Math.round(LBL_W * WIN.h / WIN.w);
function glassLayer(pat) {
  const cv = document.createElement("canvas");
  cv.width = LBL_W; cv.height = LBL_H;
  const g = cv.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#fff"; g.fillRect(0, 0, LBL_W, LBL_H);
  drawWood(g, pat, LBL_W / WIN.w, 1.5);
  const src = g.getImageData(0, 0, LBL_W, LBL_H).data;
  const lab = new Int32Array(LBL_W * LBL_H).fill(-1), tints = [], stack = [];
  const open = p => lab[p] === -1 && src[p * 4] >= 128;
  for (let s = 0; s < lab.length; s++) {
    if (!open(s)) continue;
    const id = tints.length;
    let n = 0, sx = 0, sy = 0;
    lab[s] = id; stack.push(s);
    while (stack.length) {
      const p = stack.pop(), x = p % LBL_W, y = (p - x) / LBL_W;
      n++; sx += x; sy += y;
      if (x > 0 && open(p - 1)) { lab[p - 1] = id; stack.push(p - 1); }
      if (x < LBL_W - 1 && open(p + 1)) { lab[p + 1] = id; stack.push(p + 1); }
      if (y > 0 && open(p - LBL_W)) { lab[p - LBL_W] = id; stack.push(p - LBL_W); }
      if (y < LBL_H - 1 && open(p + LBL_W)) { lab[p + LBL_W] = id; stack.push(p + LBL_W); }
    }
    const m = LBL_W / WIN.w, cx = WIN.x0 + (sx / n + 0.5) / m, cy = WIN.y0 + WIN.h - (sy / n + 0.5) / m;
    const name = pat.glassFor(pat, cx, cy);
    // each piece is cut from a slightly different sheet
    const shade = 0.82 + 0.28 * ((Math.sin(cx * 91.7 + cy * 47.3) * 43758.5453) % 1 + 1) % 1;
    tints.push(name ? JEWEL[name].map(v => v * shade) : null);
  }
  const img = g.createImageData(LBL_W, LBL_H), d = img.data;
  for (let p = 0; p < lab.length; p++) {
    const t = lab[p] >= 0 && tints[lab[p]];
    if (t) { d[p * 4] = t[0] * 255 + 0.5; d[p * 4 + 1] = t[1] * 255 + 0.5; d[p * 4 + 2] = t[2] * 255 + 0.5; d[p * 4 + 3] = 255; }
  }
  for (let pass = 0; pass < 3; pass++) {
    const prev = new Uint8ClampedArray(d);
    for (let p = 0; p < lab.length; p++) {
      if (prev[p * 4 + 3] || lab[p] >= 0) continue;   // only grow into wood
      const x = p % LBL_W;
      for (const q of [x > 0 ? p - 1 : -1, x < LBL_W - 1 ? p + 1 : -1, p - LBL_W, p + LBL_W]) {
        if (q < 0 || q >= lab.length || !prev[q * 4 + 3]) continue;
        d[p * 4] = prev[q * 4]; d[p * 4 + 1] = prev[q * 4 + 1]; d[p * 4 + 2] = prev[q * 4 + 2]; d[p * 4 + 3] = 255;
        break;
      }
    }
  }
  g.putImageData(img, 0, 0);
  return cv;
}

function drawMask(pat) {
  const g = maskCanvas.getContext("2d");
  g.globalCompositeOperation = "source-over";
  g.fillStyle = "#fff"; g.fillRect(0, 0, MASK_W, MASK_H);
  g.imageSmoothingEnabled = true;
  g.drawImage(glassLayer(pat), 0, 0, MASK_W, MASK_H);
  g.globalCompositeOperation = "destination-out";   // the wood is cut out of the alpha channel
  drawWood(g, pat, PX);
  g.globalCompositeOperation = "source-over";
  maskTex.needsUpdate = true;
}

/* noise volume for drifting dust density */
const noiseTex = (() => {
  const N = 32, raw = new Float32Array(N * N * N), out = new Uint8Array(N * N * N);
  for (let i = 0; i < raw.length; i++) raw[i] = Math.random();
  const at = (x, y, z) => raw[((z + N) % N) * N * N + ((y + N) % N) * N + ((x + N) % N)];
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += at(x + dx, y + dy, z + dz);
    out[z * N * N + y * N + x] = Math.min(255, Math.max(0, ((s / 27) - 0.5) * 3.2 * 255 + 128));
  }
  const t = new THREE.Data3DTexture(out, N, N, N);
  t.format = THREE.RedFormat; t.type = THREE.UnsignedByteType;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = t.wrapR = THREE.RepeatWrapping;
  t.unpackAlignment = 1; t.needsUpdate = true;
  return t;
})();

/* ---------- Shared uniforms ---------- */
const U = {
  uL: { value: new THREE.Vector3(0, 0.5, -0.8).normalize() },
  uWin: { value: new THREE.Vector4(WIN.x0, WIN.y0, WIN.w, WIN.h) },
  uZ: { value: new THREE.Vector4(-WALL_T, LAT.zc + (pattern.depth || LAT.d) / 2, LAT.zc - (pattern.depth || LAT.d) / 2, 0) },
  uMask: { value: maskTex },
  uTexel: { value: WIN.w / MASK_W },
  uSunCol: { value: new THREE.Vector3(1, 1, 1) },
  uSkyCol: { value: new THREE.Vector3(0.2, 0.25, 0.3) },
  uAmb: { value: new THREE.Vector3(0.01, 0.01, 0.012) },
  uBouncePos: { value: new THREE.Vector3(0, 0.3, 2) },
  uBounceCol: { value: new THREE.Vector3(0.2, 0.15, 0.1) },
  uZenith: { value: new THREE.Vector3(0.3, 0.5, 1.0) },
  uHorizon: { value: new THREE.Vector3(1.4, 1.2, 1.1) },
  uGlow: { value: new THREE.Vector3(1, 0.7, 0.4) },
  uTime: { value: 0 },
  uHDR: { value: HDR },
  uSkyShow: { value: 0.5 },   // how bright the view through the screen is shown
  uNight: { value: 0 },
};

const SUN_GLSL = /* glsl */`
uniform vec3 uL;
uniform vec4 uWin;
uniform vec4 uZ;
uniform sampler2D uMask;
uniform float uTexel;
float rectVis(vec2 q, float pen) {
  vec2 lo = uWin.xy, hi = uWin.xy + uWin.zw;
  vec2 a = smoothstep(lo - pen, lo + pen, q);
  vec2 b = 1.0 - smoothstep(hi - pen, hi + pen, q);
  return a.x * a.y * b.x * b.y;
}
vec4 maskAt(vec3 P, float zc, float soft) {
  float s = (zc - P.z) / uL.z;
  vec2 q = P.xy + s * uL.xy;
  vec2 uv = (q - uWin.xy) / uWin.zw;
  float lod = log2(max(s * soft / uTexel, 1.0));
  return textureLod(uMask, uv, lod);
}
// colour of the sunlight reaching P: through the wall opening, then the screen's two faces
// (the room-side face carries the glass colour, the outer face only its openness)
vec3 sunVis(vec3 P, float soft) {
  if (uL.z > -0.01 || uL.y < -0.05) return vec3(0.0);
  float v = 1.0;
  if (P.z > 0.001) { float s = -P.z / uL.z; v *= rectVis(P.xy + s * uL.xy, 0.002 + s * soft); }
  { float s = (uZ.x - P.z) / uL.z; v *= rectVis(P.xy + s * uL.xy, 0.002 + s * soft); }
  if (v <= 0.0001) return vec3(0.0);
  vec3 c = vec3(v);
  if (P.z > uZ.y) c *= maskAt(P, uZ.y, soft).rgb;
  if (P.z > uZ.z) c *= maskAt(P, uZ.z, soft).a;
  return c;
}
`;

const NOISE_GLSL = /* glsl */`
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;

/* ---------- Room surfaces ---------- */
const roomMat = new THREE.ShaderMaterial({
  uniforms: U,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    varying vec3 vPos; varying vec3 vN;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vPos = wp.xyz; vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    ${SUN_GLSL}
    ${NOISE_GLSL}
    uniform vec3 uSunCol, uSkyCol, uAmb, uBouncePos, uBounceCol, uHorizon, uZenith;
    uniform float uHDR, uSkyShow;
    varying vec3 vPos; varying vec3 vN;
    const float DADO = ${DADO.toFixed(3)};
    // the glowing screen seen mirrored in a polished floor, blurred by the floor's roughness
    vec3 screenGlint(vec3 P, vec3 V, vec3 N, float rough) {
      vec3 R = reflect(-V, N);
      if (R.z > -0.01) return vec3(0.0);
      float t = (${LAT.zc.toFixed(3)} - P.z) / R.z;
      vec2 uv = (P.xy + R.xy * t - uWin.xy) / uWin.zw;
      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec3(0.0);
      vec4 m = textureLod(uMask, uv, log2(max(t * rough / uTexel, 1.0)));
      return m.rgb * (uHorizon * 0.6 + uZenith * 0.4) * uSkyShow * 1.5;
    }
    void main() {
      vec3 P = vPos;
      vec3 N = normalize(vN);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(cameraPosition - P);
      vec3 albedo; float specK = 0.0; float specP = 20.0; float gloss = 0.0;
      if (N.y > 0.5 && P.y < 0.01) {
        // floor: large slabs of polished cream marble with soft grey veins
        vec2 xz = P.xz, q = xz / 0.9, id = floor(q), f = fract(q);
        float e = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y)) * 0.9;
        float joint = smoothstep(0.0008, 0.003 + fwidth(e) * 1.2, e);
        vec2 w = xz * 0.8 + 2.5 * vec2(fbm(xz * 0.7 + id * 3.1), fbm(xz * 0.7 + 7.3 - id * 1.7));
        float vein = 1.0 - smoothstep(0.0, 0.045, abs(fbm(w) - 0.5));
        vec3 base = vec3(0.80, 0.76, 0.69) * (0.95 + 0.08 * hash12(id)) * (0.96 + 0.08 * vnoise(xz * 9.0));
        albedo = mix(vec3(0.36, 0.33, 0.29), mix(base, vec3(0.50, 0.47, 0.44), vein * 0.6), joint);
        specK = 0.4 * joint; specP = 220.0; gloss = 0.55 * joint;
      } else if (N.y < -0.5) {
        // ceiling: cedar beams over lime plaster
        float beam = step(fract(P.x / 0.55), 0.32);
        vec3 wood = vec3(0.09, 0.05, 0.028) * (0.8 + 0.4 * fbm(vec2(P.x * 3.0, P.z * 0.4)));
        vec3 plaster = vec3(0.26, 0.18, 0.115) * (0.9 + 0.2 * fbm(P.xz * 1.3));
        albedo = mix(plaster, wood, beam);
      } else {
        vec2 wuv = abs(N.x) > 0.5 ? P.zy : P.xy;
        bool reveal = P.z < -0.001;
        if (!reveal && P.y < DADO && N.y < 0.5) {
          // zellige dado: glazed tiles in deep green with a cream border course
          vec2 q = mat2(0.7071, 0.7071, -0.7071, 0.7071) * wuv / 0.13;
          vec2 id = floor(q), f = fract(q);
          float e = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y)) * 0.13;
          float joint = smoothstep(0.001, 0.003 + fwidth(e) * 1.5, e);
          float h = hash12(id);
          vec3 glaze = vec3(0.010, 0.062, 0.055) * (0.7 + 0.6 * h);
          if (P.y > DADO - 0.1) glaze = vec3(0.55, 0.46, 0.33) * (0.85 + 0.25 * h);
          else if (P.y > DADO - 0.2) glaze = vec3(0.10, 0.05, 0.025) * (0.8 + 0.4 * h);
          albedo = mix(vec3(0.05, 0.06, 0.05), glaze, mix(1.0, joint, 0.7));
          specK = 0.35 * joint; specP = 90.0;
        } else {
          // lime plaster, gently mottled
          float m = 0.86 + 0.26 * fbm(wuv * 0.9) ;
          float fine = 0.95 + 0.1 * vnoise(wuv * 14.0);
          albedo = vec3(0.66, 0.46, 0.30) * m * fine;
        }
      }
      vec3 vis = sunVis(P, 0.0095);
      float ndl = max(dot(N, uL), 0.0);
      vec3 direct = uSunCol * ndl * vis;
      // skylight entering through the opening, treated as a small area light
      vec3 wc = vec3(uWin.x + uWin.z * 0.5, uWin.y + uWin.w * 0.5, 0.0);
      vec3 d = wc - P; float r2 = max(dot(d, d), 0.05); vec3 wl = d * inversesqrt(r2);
      float area = uWin.z * uWin.w * 0.45;
      vec3 sky = uSkyCol * max(dot(N, wl), 0.0) * max(-wl.z, 0.0) * area / (3.14159 * r2 + area);
      // warm bounce from the sunlit patch
      vec3 b = uBouncePos - P; float br2 = dot(b, b);
      vec3 bounce = uBounceCol * max(dot(N, b * inversesqrt(br2)), 0.0) / (1.0 + 0.35 * br2);
      vec3 amb = uAmb * (1.0 - 0.1 * N.y);
      vec3 col = albedo * (direct + sky + bounce + amb);
      vec3 H = normalize(uL + V);
      col += uSunCol * vis * specK * pow(max(dot(N, H), 0.0), specP) * ndl;
      if (gloss > 0.0) col += gloss * (0.04 + 0.96 * pow(1.0 - max(dot(N, V), 0.0), 5.0)) * screenGlint(P, V, N, 0.02);
      gl_FragColor = vec4(col, 1.0);   // the light uniforms already carry the HDR scale
    }`,
});

const scene = new THREE.Scene();
function plane(w, h, pos, rotX, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), roomMat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rotX || 0, rotY || 0, 0, "YXZ");
  scene.add(m);
  return m;
}
{
  const { x: RX, h: RH, d: RD } = ROOM;
  const x1 = WIN.x0 + WIN.w, y1 = WIN.y0 + WIN.h;
  plane(2 * RX, RD, [0, 0, RD / 2], -Math.PI / 2);                      // floor
  plane(2 * RX, RD, [0, RH, RD / 2], Math.PI / 2);                      // ceiling
  plane(RD, RH, [-RX, RH / 2, RD / 2], 0, Math.PI / 2);                 // left wall
  plane(RD, RH, [RX, RH / 2, RD / 2], 0, -Math.PI / 2);                 // right wall
  plane(RX + WIN.x0, RH, [(-RX + WIN.x0) / 2, RH / 2, 0]);              // back wall, left of opening
  plane(RX - x1, RH, [(RX + x1) / 2, RH / 2, 0]);                       // right of opening
  plane(WIN.w, WIN.y0, [WIN.x0 + WIN.w / 2, WIN.y0 / 2, 0]);            // below
  plane(WIN.w, RH - y1, [WIN.x0 + WIN.w / 2, (RH + y1) / 2, 0]);        // above
  plane(WALL_T, WIN.h, [WIN.x0, WIN.y0 + WIN.h / 2, -WALL_T / 2], 0, Math.PI / 2);   // reveals
  plane(WALL_T, WIN.h, [x1, WIN.y0 + WIN.h / 2, -WALL_T / 2], 0, -Math.PI / 2);
  plane(WIN.w, WALL_T, [WIN.x0 + WIN.w / 2, WIN.y0, -WALL_T / 2], -Math.PI / 2);
  plane(WIN.w, WALL_T, [WIN.x0 + WIN.w / 2, y1, -WALL_T / 2], Math.PI / 2);
}

/* ---------- The carved screen ---------- */
const woodMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.13, 0.07, 0.036), roughness: 0.6, metalness: 0 });
const BOX = new THREE.BoxGeometry(1, 1, 1);
const ROD = new THREE.CylinderGeometry(0.5, 0.5, 1, 8, 1);   // turned spindles
const BEAD = new THREE.SphereGeometry(1, 8, 6);
function buildScreen(pat) {
  const group = new THREE.Group();
  const all = [], rods = [];
  const clip = (a, b) => {   // Liang-Barsky against the opening, lightly expanded
    const m = 0.03, xmin = WIN.x0 - m, xmax = WIN.x0 + WIN.w + m, ymin = WIN.y0 - m, ymax = WIN.y0 + WIN.h + m;
    let t0 = 0, t1 = 1; const dx = b[0] - a[0], dy = b[1] - a[1];
    for (const [p, q] of [[-dx, a[0] - xmin], [dx, xmax - a[0]], [-dy, a[1] - ymin], [dy, ymax - a[1]]]) {
      if (p === 0) { if (q < 0) return null; continue; }
      const r = q / p;
      if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; } else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return [[a[0] + dx * t0, a[1] + dy * t0], [a[0] + dx * t1, a[1] + dy * t1]];
  };
  for (const s of pat.bars) { const c = clip(s[0], s[1]); if (c) (pat.round ? rods : all).push([c[0], c[1], pat.barW || LAT.bar, true]); }
  for (const s of pat.spokes) all.push([s[0], s[1], LAT.bar * 0.5, false]);
  for (const poly of pat.frames) for (const [a, b] of ring(poly)) all.push([a, b, LAT.bar * 0.5, true]);
  const fw = 0.09, x1 = WIN.x0 + WIN.w, y1 = WIN.y0 + WIN.h;
  const frame = [
    [[WIN.x0, WIN.y0 + fw / 2], [x1, WIN.y0 + fw / 2]], [[WIN.x0, y1 - fw / 2], [x1, y1 - fw / 2]],
    [[WIN.x0 + fw / 2, WIN.y0], [WIN.x0 + fw / 2, y1]], [[x1 - fw / 2, WIN.y0], [x1 - fw / 2, y1]],
  ];
  const inst = new THREE.InstancedMesh(BOX, woodMat, all.length + 4);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), T = new THREE.Vector3(), Z = new THREE.Vector3(0, 0, 1);
  let n = 0;
  for (const [a, b, w, ext] of all) {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    if (len < 1e-4) continue;
    T.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, LAT.zc);
    Q.setFromAxisAngle(Z, Math.atan2(dy, dx));
    S.set(len + (ext ? w : 0), w, LAT.d);
    inst.setMatrixAt(n++, M.compose(T, Q, S));
  }

  if (!qs.has("q")) scale = Math.min(scale, maxScale());   // a window made bigger keeps to the pixel budget
  W = Math.max(2, Math.round(cw * scale)); H = Math.max(2, Math.round(ch * scale));
  renderer.setSize(W, H, false);
  for (const rt of [sceneRT, fogRT, b1a, b1b, b2a, b2b]) if (rt) rt.dispose();
  sceneRT = makeRT(W, H, true);
  fogRT = makeRT(W >> 1, H >> 1);
  b1a = makeRT(W >> 2, H >> 2); b1b = makeRT(W >> 2, H >> 2);
  b2a = makeRT(W >> 3, H >> 3); b2b = makeRT(W >> 3, H >> 3);
  const aspect = cw / ch;
  camera.aspect = aspect;
  // keep roughly 42 degrees of horizontal view on narrow screens, 46 vertical on wide ones
  const hf = 42 * Math.PI / 180;
  camera.fov = aspect < 1.15 ? Math.min(74, 2 * Math.atan(Math.tan(hf / 2) / aspect) * 180 / Math.PI) : 46;
  camera.updateProjectionMatrix();
  compMat.uniforms.uAspect.value = aspect;
  compMat.uniforms.uFogTexel.value.set(1 / fogRT.width, 1 / fogRT.height);
  dustU.uPx.value = 0.012 * H / (2 * Math.tan(camera.fov * Math.PI / 360));
}
window.addEventListener("resize", resize);
resize();

function pass(mat, target) {
  fsMesh.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(fsScene, fsCam);
}

/* ---------- The day: sun position, colour and the room's response ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const bounceTmp = new THREE.Vector3();
// t is the sun's journey: 0 sunrise, 0.5 noon, 1 sunset, and a little past 1 the blue hour.
const T_MIN = 0, T_MAX = 1.055;
const DAY = [
  //       sunlight colour         sky overhead               sky at the horizon
  { t: -0.10, sun: [1.00, 0.45, 0.42], zen: [0.030, 0.050, 0.150], hor: [0.22, 0.17, 0.32] },  // before sunrise
  { t: 0.00, sun: [1.00, 0.54, 0.60], zen: [0.20, 0.21, 0.50], hor: [1.70, 0.84, 0.95] },     // rose
  { t: 0.09, sun: [1.00, 0.73, 0.40], zen: [0.27, 0.38, 0.86], hor: [1.80, 1.25, 0.70] },     // gold
  { t: 0.27, sun: [1.00, 0.96, 0.91], zen: [0.30, 0.56, 1.35], hor: [1.55, 1.70, 1.90] },     // white midday
  { t: 0.73, sun: [1.00, 0.96, 0.91], zen: [0.30, 0.56, 1.35], hor: [1.55, 1.70, 1.90] },
  { t: 0.89, sun: [1.00, 0.64, 0.25], zen: [0.24, 0.31, 0.72], hor: [1.95, 1.05, 0.45] },     // late gold
  { t: 0.985, sun: [1.00, 0.37, 0.07], zen: [0.13, 0.12, 0.34], hor: [2.15, 0.60, 0.17] },    // deep orange
  { t: 1.035, sun: [1.00, 0.30, 0.10], zen: [0.035, 0.085, 0.32], hor: [0.25, 0.30, 0.62] },  // blue hour
  { t: 1.10, sun: [1.00, 0.30, 0.10], zen: [0.018, 0.030, 0.11], hor: [0.09, 0.09, 0.20] },
];
function dayAt(t) {
  let i = 0;
  while (i < DAY.length - 2 && t > DAY[i + 1].t) i++;
  const a = DAY[i], b = DAY[i + 1], k = smooth(a.t, b.t, t);
  return { sun: mix3(a.sun, b.sun, k), zen: mix3(a.zen, b.zen, k), hor: mix3(a.hor, b.hor, k) };
}
function applyDay(t) {
  const az = (t - 0.5) * 2.3;
  const el = 0.035 + 0.95 * Math.sin(Math.PI * t);
  const ce = Math.cos(el);
  const L = U.uL.value.set(Math.sin(az) * ce, Math.sin(el), -Math.cos(az) * ce).normalize();
  const e = clamp(el / 0.95, 0, 1);
  const up = smooth(-0.03, 0.1, el);                // sun above the horizon
  const lit = smooth(-0.12, 0.04, el);
  const { sun: col, zen, hor } = dayAt(t);
  const I = 6.0 * up * (0.55 + 0.45 * smooth(0, 0.5, e));
  const sun = [col[0] * I, col[1] * I, col[2] * I];
  U.uSunCol.value.set(sun[0], sun[1], sun[2]).multiplyScalar(HDR);
  U.uZenith.value.set(...zen).multiplyScalar(HDR);
  U.uHorizon.value.set(...hor).multiplyScalar(HDR);
  U.uGlow.value.set(col[0], col[1] * 0.85, col[2] * 0.7).multiplyScalar((0.9 + 1.4 * (1 - e)) * lit * HDR);
  const skyAvg = mix3(zen, hor, 0.6);
  // once the sun is down the blue sky is the room's only light, so let more of it in
  const dusk = 1 + 1.4 * (1 - up);
  U.uSkyCol.value.set(...skyAvg).multiplyScalar(0.42 * dusk * HDR);
  U.uAmb.value.set(0.006 + skyAvg[0] * 0.008, 0.005 + skyAvg[1] * 0.008, 0.006 + skyAvg[2] * 0.010).multiplyScalar(dusk * HDR);

  // where does the beam land? trace from the screen's centre back along the light
  const o = [WIN.x0 + WIN.w / 2, WIN.y0 + WIN.h / 2, 0], d = [-L.x, -L.y, -L.z];
  let best = 1e9, n = [0, 1, 0];
  const tryHit = (tt, nn) => { if (tt > 0 && tt < best) { best = tt; n = nn; } };
  if (d[1] < 0) tryHit(-o[1] / d[1], [0, 1, 0]);
  if (d[0] < 0) tryHit((-ROOM.x - o[0]) / d[0], [1, 0, 0]);
  if (d[0] > 0) tryHit((ROOM.x - o[0]) / d[0], [-1, 0, 0]);
  if (d[2] > 0) tryHit((ROOM.d - o[2]) / d[2], [0, 0, -1]);
  if (best > 1e8) best = 2;
  bounceTmp.set(o[0] + d[0] * best + n[0] * 0.5, o[1] + d[1] * best + n[1] * 0.5, o[2] + d[2] * best + n[2] * 0.5);
  U.uBouncePos.value.copy(bounceTmp);
  const bk = 0.16 * (0.4 + 0.6 * clamp(L.y + 0.2, 0, 1));
  U.uBounceCol.value.set(sun[0] * bk, sun[1] * bk * 0.92, sun[2] * bk * 0.8).multiplyScalar(HDR);

  // three's lights for the wooden screen (Lambert there carries 1/pi)
  const PI = Math.PI;
  sunLight.color.setRGB(col[0], col[1], col[2]);
  sunLight.intensity = I * PI * 0.8 * HDR;
  sunLight.position.set(L.x * 10, L.y * 10 + 2.4, L.z * 10);
  sunLight.target.position.set(0, 2.4, 0);
  hemi.color.setRGB(skyAvg[0], skyAvg[1], skyAvg[2]);
  hemi.groundColor.setRGB(col[0] * 0.5, col[1] * 0.35, col[2] * 0.25);
  hemi.intensity = (0.05 + 0.12 * up) * PI * HDR;
  bounceLight.position.copy(bounceTmp);
  bounceLight.color.setRGB(col[0], col[1] * 0.92, col[2] * 0.8);
  bounceLight.intensity = I * bk * PI / 0.35 * HDR;

  compMat.uniforms.uFogCol.value.set(sun[0], sun[1], sun[2]).multiplyScalar(0.55);
  const exposure = lerp(1.6, 1.0, smooth(0.05, 0.6, e)) * lerp(1.8, 1, up);
  compMat.uniforms.uExposure.value = exposure;
  brightMat.uniforms.uThresh.value = 1.4 / exposure;
  // the view is shown dimmer than it really is, so it reads through the gaps instead of burning white
  U.uSkyShow.value = 0.5 / Math.pow(exposure, 1.3);
  U.uNight.value = smooth(0.02, -0.1, el);
}

/* ---------- Input: cursor, drag, tilt ---------- */
const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches || document.documentElement.dataset.theme === "dark";
const themeDark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : prefersDark;
let tCur = themeDark ? 1.07 : -0.07;
let tTarget = themeDark ? 0.86 : 0.26;
const introFrom = tCur, introTo = tTarget, INTRO = 6.5;
let introLeft = reduceMotion ? 0 : INTRO;
if (reduceMotion) tCur = tTarget;
if (qs.has("t")) { tCur = tTarget = parseFloat(qs.get("t")); introLeft = 0; }
let lastInput = -1e9, driftDir = 1, mode = "none";
const hint = document.getElementById("hint");
hint.textContent = isTouch ? "Drag across the room to move the sun" : "Move across the room to move the sun";
function touched() {
  lastInput = performance.now();
  if (introLeft > 0) { introLeft = 0; }
  if (!hint.classList.contains("gone")) setTimeout(() => hint.classList.add("gone"), 3500);
}
let dragX = null;
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" || e.pointerType === "pen") {
    if (mode === "tilt") return;
    tTarget = lerp(T_MIN, T_MAX, clamp(e.clientX / window.innerWidth, 0, 1));
    touched();
  } else if (dragX !== null) {
    tTarget = clamp(tTarget + (e.clientX - dragX) / window.innerWidth * 1.15 * (T_MAX - T_MIN), T_MIN, T_MAX);
    dragX = e.clientX;
    touched();
  }
});
canvas.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") { dragX = e.clientX; if (introLeft > 0) tTarget = tCur; touched(); } });
// the arrow keys move the sun too
window.addEventListener("keydown", e => {
  const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!step || mode === "tilt") return;
  if (introLeft > 0) tTarget = tCur;
  tTarget = clamp(tTarget + step * 0.035, T_MIN, T_MAX);
  touched();
});
const endDrag = () => { dragX = null; };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

function onTilt(e) {
  if (e.gamma == null) return;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const v = ang === 90 ? e.beta : (ang === -90 || ang === 270) ? -e.beta : e.gamma;
  if (mode !== "tilt") { mode = "tilt"; hint.textContent = "Tilt your phone to move the sun"; hint.classList.remove("gone"); }
  tTarget = lerp(T_MIN, T_MAX, clamp(0.5 + v / 70, 0, 1));
  touched();
}
const tiltBtn = document.getElementById("tilt");
const topLevel = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
if (isTouch && window.DeviceOrientationEvent) {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    if (topLevel) {
      tiltBtn.hidden = false;
      tiltBtn.addEventListener("click", () => {
        DeviceOrientationEvent.requestPermission().then(state => {
          tiltBtn.hidden = true;
          if (state === "granted") window.addEventListener("deviceorientation", onTilt);
        }).catch(() => { tiltBtn.hidden = true; });
      });
    }
  } else {
    window.addEventListener("deviceorientation", onTilt);
  }
}

/* ---------- Sound: a courtyard fountain, distant birds by day, crickets after dusk ---------- */
// All of it is made with the Web Audio API, so nothing is downloaded. It stays silent until the
// first tap or click anywhere, and turning it off is remembered.
const sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const btn = document.getElementById("sound");
  if (!AC) { btn.hidden = true; return { update() {} }; }
  const R = Math.random, SR = 44100;
  let ctx = null, master = null, birds = null, crickets = null, loops = null;
  let wanted = true, armed = false, day = 0.5, nextBird = 0, crickLevel = -1;
  try { wanted = localStorage.getItem("mashrabiya-sound") !== "off"; } catch (e) {}

  // The two loops are rendered sample by sample into plain arrays, in a background worker so the
  // picture never stutters (or right here if workers are unavailable). This function runs alone in
  // the worker, so it must not reach outside itself.
  function synth() {
    const R = Math.random, SR = 44100;
    function render(sec, fill) {
      const n = Math.round(SR * sec), L = new Float32Array(n), Rt = new Float32Array(n);
      fill(L, Rt, n);
      return [L, Rt];
    }
    // a small fountain: a soft wash of falling water that surges a little, and a steady patter of
    // tiny rising bubbles, which is what makes water sound like water
    function fountain(L, Rt, n) {
      // The wash is filtered noise. The same noise is run through the filters twice and only the second
      // lap is kept, so the end flows straight back into the start; its surges repeat a whole number of
      // times per loop for the same reason.
      const wl = new Float32Array(n), wr = new Float32Array(n);
      for (let i = 0; i < n; i++) { wl[i] = R() * 2 - 1; wr[i] = R() * 2 - 1; }
      const surge = [3, 5, 8, 13].map(k => [k, R() * 6.283, 0.05 + 0.05 * R()]);
      let a = 0, b = 0, c = 0, d = 0;
      for (let i = 0; i < 2 * n; i++) {
        const j = i % n;
        a += (wl[j] - a) * 0.3; b += (a - b) * 0.05;
        c += (wr[j] - c) * 0.3; d += (c - d) * 0.05;
        if (i < n) continue;
        let m = 0.55;
        for (const [k, ph, amp] of surge) m += amp * Math.sin(6.283 * k * j / n + ph);
        L[j] = (a - b) * 0.035 * m; Rt[j] = (c - d) * 0.035 * m;
      }
      for (let k = 0, count = Math.round(n / SR * 220); k < count; k++) {
        const f0 = 380 * Math.pow(2, R() * 2.4), dur = 0.012 + 0.04 * R() * 700 / f0;
        const amp = 0.09 * R() * R() * (0.5 + 400 / f0), pan = R();
        const s0 = Math.floor(R() * n), len = Math.round(dur * SR);
        let ph = 0;
        for (let i = 0; i < len; i++) {
          const t = i / SR;
          ph += 2 * Math.PI * f0 * (1 + 1.6 * t / dur) / SR;
          const v = Math.sin(ph) * Math.min(1, t / 0.0015) * Math.exp(-t / (dur * 0.35)) * amp;
          const j = (s0 + i) % n;   // bubbles that run past the end wrap round, so the loop has no seam
          L[j] += v * (1.1 - 0.8 * pan); Rt[j] += v * (0.3 + 0.8 * pan);
        }
      }
    }
    // crickets: three of them, short pulse trains near 4.5 kHz, out of step with each other
    function cricketSong(L, Rt, n) {
      [0.2, 0.8, 0.5].forEach((pan, c) => {
        const f = 4200 + 260 * c + 120 * R(), period = 0.55 + 0.5 * R();
        for (let t0 = R() * period; t0 < n / SR - 0.15; t0 += period * (0.9 + 0.2 * R())) {
          for (let p = 0; p < 3; p++) {
            const s0 = Math.round((t0 + p * 0.032) * SR), len = Math.round(0.018 * SR);
            for (let i = 0; i < len; i++) {
              const v = Math.sin(2 * Math.PI * f * i / SR) * Math.sin(Math.PI * i / len) * 0.05;
              L[s0 + i] += v * (1 - pan); Rt[s0 + i] += v * pan;
            }
          }
        }
      });
    }
    return { fountain: render(8, fountain), crickets: render(7, cricketSong) };
  }
  let preparing = false, outside = null, basin = null;

    if (preparing) return;
    preparing = true;
    const here = () => { loops = synth(); startLoops(); };
    try {
      const url = URL.createObjectURL(new Blob([`const d = (${synth})();
postMessage(d, [d.fountain[0].buffer, d.fountain[1].buffer, d.crickets[0].buffer, d.crickets[1].buffer]);`], { type: "text/javascript" }));
      const w = new Worker(url);
      w.onmessage = e => { loops = e.data; w.terminate(); URL.revokeObjectURL(url); startLoops(); };
      w.onerror = () => { w.terminate(); here(); };

  function startLoops() {
    if (!ctx || !loops || crickets) return;
    play(loops.fountain, 0.9, basin);
    crickets = play(loops.crickets, 0, outside);
  }

  function play([L, Rt], gain, dest) {
    const buf = ctx.createBuffer(2, L.length, SR);
    buf.getChannelData(0).set(L); buf.getChannelData(1).set(Rt);
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; src.loop = true; g.gain.value = gain;
    src.connect(g).connect(dest); src.start();
    return g;
  }
  function build() {
    ctx = new AC();
    ctx.resume();
    try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) {}   // mix with other audio on iOS
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    // a courtyard's echo: a short burst of decaying noise used as the room's impulse response
    const verb = ctx.createConvolver(), n = Math.round(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / n, 3); }
    verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.3;
    verb.connect(wet).connect(master);
    // everything is outside, heard through the screen: a little dulled, with the echo behind it
    outside = ctx.createBiquadFilter(); outside.type = "lowpass"; outside.frequency.value = 5200;
    outside.connect(master); outside.connect(verb);
    basin = ctx.createBiquadFilter(); basin.type = "highpass"; basin.frequency.value = 250;   // no rumble
    basin.connect(outside);
    birds = ctx.createGain(); birds.gain.value = 0.5; birds.connect(outside);
    prepare();
    startLoops();
    nextBird = ctx.currentTime + 1.2;

  // a bird's whistle swept between two pitches, with an optional warble
  function whistle(out, t, f1, f2, dur, warble) {

      l.frequency.value = warble; lg.gain.value = f1 * 0.05;
      l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function call(t) {
    const out = ctx.createGain();
    out.gain.value = 0.35 + 0.65 * R();
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = 1.6 * R() - 0.8; out.connect(p).connect(birds); }
    else out.connect(birds);
    const kind = R(), noon = 1 - Math.min(1, Math.abs(day - 0.5) * 2);
    if (kind < 0.15 + 0.3 * noon) {
      // a laughing dove's soft, hollow coo, more often in the heat of the day
      for (const [f, d, at] of [[520, 0.15, 0], [560, 0.15, 0.21], [610, 0.26, 0.42], [550, 0.17, 0.75], [505, 0.22, 0.98]]) {
        const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
        o.type = "triangle"; lp.type = "lowpass"; lp.frequency.value = 900;
        o.frequency.setValueAtTime(f * 0.95, t + at); o.frequency.linearRampToValueAtTime(f, t + at + d * 0.4); o.frequency.linearRampToValueAtTime(f * 0.93, t + at + d);
        g.gain.setValueAtTime(0, t + at); g.gain.linearRampToValueAtTime(0.9, t + at + d * 0.35); g.gain.linearRampToValueAtTime(0, t + at + d);
        o.connect(lp).connect(g).connect(out); o.start(t + at); o.stop(t + at + d + 0.05);
      }
    } else if (kind < 0.62) {
      // a short liquid song
      const base = 1700 + 1500 * R();
      for (let i = 0, at = 0, n = 3 + Math.floor(4 * R()); i < n; i++) {
        const f = base * (0.8 + 0.45 * R()), d = 0.07 + 0.1 * R();
        whistle(out, t + at, f, f * (0.75 + 0.6 * R()), d, 20 + 30 * R());

      }
    } else {
      // a sparrow's chirps
      const f = 3000 + 1500 * R();
      for (let i = 0, n = 2 + Math.floor(4 * R()); i < n; i++) whistle(out, t + i * (0.13 + 0.04 * R()), f * 1.3, f * 0.78, 0.05, 0);
    }
    setTimeout(() => out.disconnect(), 3000);
  }
  // seconds to the next call: a dawn chorus, a drowsy noon, a few at dusk, none at night
  const gap = () => day > 1 ? 1.5 : (1.5 + 4 * R()) / (day < 0.2 ? 1 : day > 0.8 ? 0.55 : 0.25);

  function apply() {
    const on = wanted && armed;
    if (on && !ctx) build();
    if (ctx) {
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      if (on) { ctx.resume(); master.gain.linearRampToValueAtTime(0.9, now + 2.5); }
      else { master.gain.linearRampToValueAtTime(0, now + 0.5); setTimeout(() => { if (!(wanted && armed)) ctx.suspend(); }, 700); }
    }
    btn.setAttribute("aria-pressed", String(on));

  }

  function arm(e) {
    if (armed || (e.target.closest && e.target.closest(".tools"))) return;
    armed = true;
    apply();
  }

  window.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") arm(e); });
  btn.addEventListener("click", () => {
    const on = wanted && armed;
    armed = true; wanted = !on;
    try { localStorage.setItem("mashrabiya-sound", wanted ? "on" : "off"); } catch (e) {}
    apply();
  });
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (wanted && armed) ctx.resume();
  });

  return {
    update(t) {
      day = t;
      if (!ctx || ctx.state !== "running") return;
      const now = ctx.currentTime;
      if (now >= nextBird) { if (day < 1) call(now + 0.05); nextBird = now + gap(); }
      const level = 0.9 * smooth(0.985, 1.035, day);   // crickets come out with the blue hour
      if (crickets && Math.abs(level - crickLevel) > 0.01) { crickets.gain.setTargetAtTime(level, now, 0.8); crickLevel = level; }
    },
    get state() { return { ctx: ctx && ctx.state, on: wanted && armed, wanted, armed }; },
    get nodes() { return { ctx, master, birds, crickets }; },
  };
})();

/* ---------- Pattern picker: four icon buttons beside the sound button ---------- */
